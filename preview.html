<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<title>Light mode preview</title>
<link rel="stylesheet" href="assets/console.css">
<style>html,body{height:100%}.page.active{animation:none!important}.bubble{animation:none!important}</style>
</head>
<body>
<div id="shell">
  <nav class="rail">
    <div class="rail-top">
      <button class="rail-btn active"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M21 12a8 8 0 1 1-3.2-6.4"/><path d="M4 20l1.6-3.6"/></svg><span class="rail-badge">3</span></button>
      <button class="rail-btn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg></button>
      <button class="rail-btn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="9" cy="8" r="3.2"/><path d="M3 19c0-3.3 2.7-5 6-5s6 1.7 6 5"/></svg></button>
    </div>
    <div class="rail-foot">
      <button class="rail-btn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="12" cy="12" r="3.2"/><path d="M12 3v3M12 18v3M3 12h3M18 12h3"/></svg></button>
      <div class="rail-me" style="background:#8e6bd6">Z</div>
    </div>
  </nav>

  <div class="shell-main">
    <header class="topbar">
      <h2>Chats</h2>
      <div class="spacer"></div>
      <span class="conn-pill"><span class="conn-dot"></span><span>Connected</span></span>
    </header>

    <div class="pages">
      <section class="page chatpage active">
        <aside class="inbox">
          <div class="inbox-head">
            <div class="search-pill">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><circle cx="11" cy="11" r="6.4"/><path d="m16 16 4 4"/></svg>
              <input type="search" placeholder="Search conversations">
            </div>
          </div>
          <div class="chips">
            <button class="chip-btn on">All</button>
            <button class="chip-btn">Pending</button>
            <button class="chip-btn">Assigned</button>
            <button class="chip-btn">Unassigned</button>
          </div>
          <div class="conv-list">
            <button class="conv">
              <div class="conv-av" style="background:#2f9e6e">W</div>
              <div class="conv-body">
                <div class="conv-line1"><b>Website visitor</b><span class="conv-time">Yesterday</span></div>
                <div class="conv-line2"><span class="conv-prev">hi</span><span class="unread">2</span></div>
              </div>
            </button>
            <button class="conv on">
              <div class="conv-av" style="background:#b0447a">D</div>
              <div class="conv-body">
                <div class="conv-line1"><b>DEAD</b><span class="conv-time">Yesterday</span></div>
                <div class="conv-line2"><span class="conv-prev">You: jbk</span><span class="tag pending">Pending</span></div>
              </div>
            </button>
            <button class="conv">
              <div class="conv-av" style="background:#c8722f">Z</div>
              <div class="conv-body">
                <div class="conv-line1"><b>zawar</b><span class="conv-time">Yesterday</span></div>
                <div class="conv-line2"><span class="conv-prev">You: ggfg</span><span class="tag closed">Closed</span></div>
              </div>
            </button>
          </div>
          <div class="inbox-resizer"></div>
        </aside>

        <main class="thread">
          <div class="thread-head">
            <button class="icon-btn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="m14 6-6 6 6 6"/></svg></button>
            <button class="thread-who">
              <div class="conv-av" style="background:#b0447a">D</div>
              <span><b>DEAD</b><span>bachpanuser@gmail.com</span></span>
            </button>
            <button class="icon-btn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg></button>
          </div>
          <div class="msgs">
            <div class="daystamp">August 1, 2026</div>
            <div class="msg-wrap">
              <div class="msg-av" style="background:#b0447a">D</div>
              <div class="bubble"><span class="txt">DEAD would like to talk to support.
They asked: timing</span><span class="meta">06:39 PM</span></div>
            </div>
            <div class="msg-wrap out">
              <div class="bubble"><span class="txt">cvkfgj</span><span class="meta">06:40 PM</span></div>
            </div>
            <div class="daystamp">Yesterday</div>
            <div class="msg-wrap out">
              <div class="bubble"><span class="txt">gjuu</span><span class="meta">05:30 AM</span></div>
            </div>
            <div class="msg-wrap out">
              <div class="bubble"><span class="txt">hu</span><span class="meta">08:57 AM</span></div>
            </div>
            <div class="sysline">Customer care connected.</div>
            <div class="msg-wrap">
              <div class="msg-av bot"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M21 12a8 8 0 1 1-3.2-6.4"/></svg></div>
              <div class="bubble"><span class="txt">Thanks for waiting — an agent is with you now.</span><span class="meta">08:57 AM</span></div>
            </div>
            <div class="msg-wrap out">
              <div class="bubble"><span class="txt">oiihhi</span><span class="meta">08:57 AM</span></div>
            </div>
            <div class="msg-wrap out">
              <div class="bubble"><span class="txt">jbk</span><span class="meta">09:05 AM</span></div>
            </div>
          </div>
          <div class="composer">
            <textarea rows="1" placeholder="Message"></textarea>
            <button class="send-btn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="m4 12 16-8-6 8 6 8z"/></svg></button>
          </div>
        </main>
      </section>
    </div>
  </div>
</div>
</body>
</html>
